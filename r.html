<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Restaurant Page — Blueroll</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: linear-gradient(135deg, #065F46, #059669);
  min-height: 100vh;
  color: #1f2937;
}
.container {
  max-width: 480px;
  margin: 0 auto;
  padding: 24px;
}
.card {
  background: #fff;
  border-radius: 16px;
  padding: 20px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  margin-bottom: 16px;
}
h1 { font-size: 22px; font-weight: 700; color: #111827; margin-bottom: 6px; }
.address { font-size: 14px; color: #6b7280; line-height: 1.4; }

/* Google Rating */
.google-rating { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
.stars { color: #f59e0b; font-size: 18px; letter-spacing: 1px; }
.stars .empty { color: #d1d5db; }
.rating-text { font-size: 14px; color: #6b7280; }

/* FSA Badge */
.fsa-badge {
  display: inline-block;
  padding: 10px 18px;
  border-radius: 10px;
  color: #fff;
  font-weight: 700;
  font-size: 16px;
  margin-bottom: 16px;
}
.score-row { margin-bottom: 10px; }
.score-label { font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 4px; display: flex; justify-content: space-between; }
.score-bar-bg { background: #e5e7eb; border-radius: 6px; height: 8px; overflow: hidden; }
.score-bar { height: 100%; border-radius: 6px; transition: width 0.4s; }

/* Link buttons */
.link-btn {
  display: flex;
  align-items: center;
  gap: 12px;
  background: #fff;
  border: 1px solid #e5e7eb;
  border-radius: 12px;
  padding: 14px 16px;
  text-decoration: none;
  color: #374151;
  font-size: 15px;
  font-weight: 500;
  min-height: 48px;
  margin-bottom: 10px;
  cursor: pointer;
  transition: background 0.15s;
}
.link-btn:hover { background: #f9fafb; }
.link-btn .icon { font-size: 20px; flex-shrink: 0; }

/* Buttons */
.btn-primary {
  display: block;
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 12px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  text-align: center;
  text-decoration: none;
}
.btn-emerald { background: #059669; color: #fff; }
.btn-emerald:hover { background: #047857; }
.btn-outline {
  background: transparent;
  color: #059669;
  border: 2px solid #059669;
}
.btn-outline:hover { background: rgba(5,150,105,0.08); }

/* App download */
.app-section { text-align: center; margin-top: 20px; }
.app-section .subtitle { font-size: 13px; color: rgba(255,255,255,0.75); margin-top: 8px; }
.app-btn {
  display: inline-block;
  background: #fff;
  color: #059669;
  font-weight: 700;
  font-size: 15px;
  padding: 14px 28px;
  border-radius: 12px;
  text-decoration: none;
}

/* Footer */
.footer {
  text-align: center;
  padding: 24px 0 12px;
  font-size: 12px;
  color: rgba(255,255,255,0.6);
}

/* Modal */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  justify-content: center;
  align-items: center;
  z-index: 1000;
  padding: 24px;
}
.modal-overlay.active { display: flex; }
.modal-card {
  background: #fff;
  border-radius: 16px;
  padding: 24px;
  width: 100%;
  max-width: 420px;
  max-height: 90vh;
  overflow-y: auto;
}
.modal-card h2 { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
.modal-card p { font-size: 14px; color: #6b7280; margin-bottom: 16px; }
.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 4px; }
.form-input {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid #d1d5db;
  border-radius: 8px;
  font-size: 15px;
  outline: none;
}
.form-input:focus { border-color: #059669; box-shadow: 0 0 0 2px rgba(5,150,105,0.15); }
.status-msg { font-size: 14px; margin-top: 10px; padding: 8px 12px; border-radius: 8px; display: none; }
.status-msg.success { display: block; background: #d1fae5; color: #065f46; }
.status-msg.error { display: block; background: #fee2e2; color: #991b1b; }
.btn-row { display: flex; gap: 10px; margin-top: 16px; }
.btn-row .btn-primary { flex: 1; }
.btn-cancel { background: #f3f4f6; color: #374151; }
.btn-cancel:hover { background: #e5e7eb; }

/* Custom links in edit */
.custom-link-row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
.custom-link-row .form-input { flex: 1; }
.remove-link { background: none; border: none; font-size: 18px; cursor: pointer; color: #9ca3af; padding: 4px; }
.remove-link:hover { color: #ef4444; }
.add-link-btn { background: none; border: 1px dashed #d1d5db; border-radius: 8px; padding: 8px; width: 100%; font-size: 14px; color: #6b7280; cursor: pointer; }
.add-link-btn:hover { border-color: #059669; color: #059669; }

/* Loading */
.loading { text-align: center; padding: 60px 0; color: rgba(255,255,255,0.8); font-size: 16px; }

#page-content { display: none; }
</style>
</head>
<body>

<div class="container">
  <div id="loading" class="loading">Loading...</div>
  <div id="page-content">
    <!-- Header -->
    <div id="header-card" class="card" style="display:none;">
      <h1 id="biz-name"></h1>
      <div id="biz-address" class="address"></div>
      <div id="google-rating" class="google-rating" style="display:none;">
        <span id="stars" class="stars"></span>
        <span id="rating-text" class="rating-text"></span>
      </div>
    </div>

    <!-- FSA Rating -->
    <div id="fsa-card" class="card" style="display:none;">
      <div id="fsa-badge" class="fsa-badge"></div>
      <div id="score-bars"></div>
    </div>

    <!-- Links -->
    <div id="links-section"></div>

    <!-- Claim / Edit -->
    <div id="claim-edit-section" style="margin-bottom:16px;"></div>

    <!-- App download -->
    <div class="app-section">
      <a href="https://blueroll.app" class="app-btn" target="_blank">📱 Try Blueroll Free</a>
      <div class="subtitle">Digital HACCP checklists for your kitchen</div>
    </div>

    <!-- Footer -->
    <div class="footer">Powered by Blueroll &middot; Food Safety Made Simple</div>
  </div>
</div>

<!-- Claim Modal -->
<div id="claim-modal" class="modal-overlay">
  <div class="modal-card">
    <h2>Claim this page</h2>
    <p>Enter your email to verify you own this business</p>
    <div class="form-group">
      <label for="claim-email">Email address</label>
      <input type="email" id="claim-email" class="form-input" placeholder="you@restaurant.com">
    </div>
    <button class="btn-primary btn-emerald" id="claim-submit">Send verification link</button>
    <div id="claim-status" class="status-msg"></div>
  </div>
</div>

<!-- Edit Modal -->
<div id="edit-modal" class="modal-overlay">
  <div class="modal-card">
    <h2>Edit your page</h2>
    <div class="form-group">
      <label for="edit-website">Website</label>
      <input type="url" id="edit-website" class="form-input" placeholder="https://yourrestaurant.com">
    </div>
    <div class="form-group">
      <label for="edit-instagram">Instagram handle</label>
      <input type="text" id="edit-instagram" class="form-input" placeholder="yourrestaurant">
    </div>
    <div class="form-group">
      <label for="edit-facebook">Facebook URL</label>
      <input type="url" id="edit-facebook" class="form-input" placeholder="https://facebook.com/yourrestaurant">
    </div>
    <div class="form-group">
      <label for="edit-tiktok">TikTok handle</label>
      <input type="text" id="edit-tiktok" class="form-input" placeholder="yourrestaurant">
    </div>
    <div class="form-group">
      <label for="edit-phone">Phone</label>
      <input type="tel" id="edit-phone" class="form-input" placeholder="+44 20 1234 5678">
    </div>
    <div class="form-group">
      <label for="edit-email">Email (public contact)</label>
      <input type="email" id="edit-email" class="form-input" placeholder="hello@yourrestaurant.com">
    </div>
    <div class="form-group">
      <label>Custom links</label>
      <div id="custom-links-list"></div>
      <button class="add-link-btn" id="add-link-btn">+ Add link</button>
    </div>
    <div class="btn-row">
      <button class="btn-primary btn-cancel" id="edit-cancel">Cancel</button>
      <button class="btn-primary btn-emerald" id="edit-save">Save changes</button>
    </div>
    <div id="edit-status" class="status-msg"></div>
  </div>
</div>

<script>
(function() {
  const API = 'https://web-production-54cc.up.railway.app';

  const RATING_COLORS = {5:'#059669',4:'#65a30d',3:'#d97706',2:'#ea580c',1:'#dc2626',0:'#991b1b'};
  const RATING_TEXT = {0:'Urgent Improvement Necessary',1:'Major Improvement Necessary',2:'Improvement Necessary',3:'Generally Satisfactory',4:'Good',5:'Very Good'};

  const params = new URLSearchParams(location.search);
  const fhrsId = params.get('id') || params.get('fhrsid');
  const tokenParam = params.get('token');

  let bizData = null;
  let editToken = null;

  // --- Init ---
  if (fhrsId) {
    init();
  } else if (params.get('name')) {
    renderStatic();
  } else {
    showError('No business ID provided.');
  }

  async function init() {
    try {
      // Handle token verification
      if (tokenParam) {
        try {
          const vRes = await fetch(API + '/api/business/' + fhrsId + '/verify?token=' + encodeURIComponent(tokenParam));
          if (vRes.ok) {
            localStorage.setItem('blueroll_edit_' + fhrsId, tokenParam);
            // Clean URL
            const url = new URL(location.href);
            url.searchParams.delete('token');
            history.replaceState(null, '', url.toString());
          }
        } catch(e) { /* ignore token errors */ }
      }

      // Check stored token
      const stored = localStorage.getItem('blueroll_edit_' + fhrsId);
      if (stored) {
        try {
          const vRes = await fetch(API + '/api/business/' + fhrsId + '/verify?token=' + encodeURIComponent(stored));
          if (vRes.ok) {
            editToken = stored;
          } else {
            localStorage.removeItem('blueroll_edit_' + fhrsId);
          }
        } catch(e) {
          localStorage.removeItem('blueroll_edit_' + fhrsId);
        }
      }

      // Fetch business data
      const res = await fetch(API + '/api/business/' + fhrsId + '/public');
      if (!res.ok) throw new Error('Business not found');
      bizData = await res.json();
      render();
    } catch(e) {
      showError(e.message || 'Failed to load business data.');
    }
  }

  function showError(msg) {
    document.getElementById('loading').textContent = msg;
  }

  function renderStatic() {
    bizData = {
      name: params.get('name') || '',
      rating: params.get('rating') != null ? parseInt(params.get('rating')) : null,
      address_1: params.get('address') || '',
    };
    render();
  }

  function render() {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('page-content').style.display = 'block';

    const d = bizData;

    // Header
    if (d.name) {
      document.getElementById('header-card').style.display = 'block';
      document.getElementById('biz-name').textContent = d.name;
      const addrParts = [d.address_1, d.address_2, d.address_3, d.address_4, d.postcode].filter(Boolean);
      if (addrParts.length) {
        document.getElementById('biz-address').textContent = addrParts.join(', ');
      }

      // Google Rating
      if (d.google_rating) {
        const gr = document.getElementById('google-rating');
        gr.style.display = 'flex';
        const rating = parseFloat(d.google_rating);
        let starsHtml = '';
        for (let i = 1; i <= 5; i++) {
          starsHtml += i <= Math.round(rating) ? '★' : '<span class="empty">★</span>';
        }
        document.getElementById('stars').innerHTML = starsHtml;
        let rText = rating.toFixed(1);
        if (d.google_reviews_count) rText += ' (' + d.google_reviews_count + ' reviews)';
        document.getElementById('rating-text').textContent = rText;
      }
    }

    // FSA Rating
    if (d.rating != null && d.rating !== '' && d.rating !== undefined) {
      const r = parseInt(d.rating);
      const fsaCard = document.getElementById('fsa-card');
      fsaCard.style.display = 'block';
      const badge = document.getElementById('fsa-badge');
      badge.style.background = RATING_COLORS[r] || '#6b7280';
      badge.textContent = r + ' — ' + (RATING_TEXT[r] || '');

      // Score bars
      const scores = [];
      if (d.hygiene_score != null) scores.push({ label: 'Hygiene', score: parseInt(d.hygiene_score), max: 25 });
      if (d.structural_score != null) scores.push({ label: 'Structure', score: parseInt(d.structural_score), max: 25 });
      if (d.management_score != null) scores.push({ label: 'Management', score: parseInt(d.management_score), max: 30 });

      if (scores.length) {
        const barsEl = document.getElementById('score-bars');
        barsEl.innerHTML = scores.map(function(s) {
          const pct = Math.max(5, 100 - (s.score / s.max * 100));
          let level, color;
          if (s.score <= 5) { level = 'Good'; color = '#059669'; }
          else if (s.score <= 10) { level = 'Fair'; color = '#d97706'; }
          else { level = 'Poor'; color = '#dc2626'; }
          return '<div class="score-row">' +
            '<div class="score-label"><span>' + s.label + '</span><span style="color:' + color + '">' + level + '</span></div>' +
            '<div class="score-bar-bg"><div class="score-bar" style="width:' + pct + '%;background:' + color + '"></div></div>' +
            '</div>';
        }).join('');
      }
    }

    // Links
    const linksEl = document.getElementById('links-section');
    let linksHtml = '';
    function addLink(icon, label, url) {
      if (!url) return;
      linksHtml += '<a class="link-btn" href="' + escHtml(url) + '" target="_blank" rel="noopener"><span class="icon">' + icon + '</span>' + escHtml(label) + '</a>';
    }
    addLink('🌐', 'Visit Website', d.website);
    if (d.instagram) addLink('📸', 'Instagram', 'https://instagram.com/' + d.instagram.replace(/^@/, ''));
    addLink('📘', 'Facebook', d.facebook);
    if (d.tiktok) addLink('🎵', 'TikTok', 'https://tiktok.com/@' + d.tiktok.replace(/^@/, ''));
    if (d.phone) addLink('📞', 'Call Us', 'tel:' + d.phone);
    if (d.email) addLink('✉️', 'Email', 'mailto:' + d.email);
    addLink('📍', 'Google Maps', d.google_maps_url);
    if (d.custom_links && d.custom_links.length) {
      d.custom_links.forEach(function(cl) {
        addLink('🔗', cl.label, cl.url);
      });
    }
    linksEl.innerHTML = linksHtml;

    // Claim / Edit
    const ceEl = document.getElementById('claim-edit-section');
    if (fhrsId) {
      if (editToken) {
        ceEl.innerHTML = '<button class="btn-primary btn-outline" id="edit-btn">✏️ Edit your page</button>';
        document.getElementById('edit-btn').addEventListener('click', openEditModal);
      } else if (!d.claimed) {
        ceEl.innerHTML = '<button class="btn-primary btn-emerald" id="claim-btn">Claim this page</button>';
        document.getElementById('claim-btn').addEventListener('click', openClaimModal);
      }
    }

    // Update title
    if (d.name) document.title = d.name + ' — Blueroll';
  }

  // --- Claim Modal ---
  function openClaimModal() {
    document.getElementById('claim-modal').classList.add('active');
    document.getElementById('claim-status').className = 'status-msg';
    document.getElementById('claim-status').textContent = '';
    document.getElementById('claim-email').value = '';
  }

  document.getElementById('claim-modal').addEventListener('click', function(e) {
    if (e.target === this) this.classList.remove('active');
  });

  document.getElementById('claim-submit').addEventListener('click', async function() {
    const email = document.getElementById('claim-email').value.trim();
    const statusEl = document.getElementById('claim-status');
    if (!email) { statusEl.className = 'status-msg error'; statusEl.textContent = 'Please enter an email address.'; return; }
    this.disabled = true;
    this.textContent = 'Sending...';
    try {
      const res = await fetch(API + '/api/business/' + fhrsId + '/claim', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email })
      });
      if (res.status === 409) {
        statusEl.className = 'status-msg error';
        statusEl.textContent = 'This business has already been claimed.';
      } else if (res.ok) {
        statusEl.className = 'status-msg success';
        statusEl.textContent = 'Verification link sent! Check your email.';
      } else {
        const data = await res.json().catch(function() { return {}; });
        statusEl.className = 'status-msg error';
        statusEl.textContent = data.message || 'Something went wrong. Please try again.';
      }
    } catch(e) {
      statusEl.className = 'status-msg error';
      statusEl.textContent = 'Network error. Please try again.';
    }
    this.disabled = false;
    this.textContent = 'Send verification link';
  });

  // --- Edit Modal ---
  function openEditModal() {
    const d = bizData;
    document.getElementById('edit-website').value = d.website || '';
    document.getElementById('edit-instagram').value = d.instagram || '';
    document.getElementById('edit-facebook').value = d.facebook || '';
    document.getElementById('edit-tiktok').value = d.tiktok || '';
    document.getElementById('edit-phone').value = d.phone || '';
    document.getElementById('edit-email').value = d.email || '';
    renderCustomLinks(d.custom_links || []);
    document.getElementById('edit-status').className = 'status-msg';
    document.getElementById('edit-status').textContent = '';
    document.getElementById('edit-modal').classList.add('active');
  }

  function renderCustomLinks(links) {
    const list = document.getElementById('custom-links-list');
    list.innerHTML = links.map(function(cl, i) {
      return '<div class="custom-link-row" data-idx="' + i + '">' +
        '<input class="form-input cl-label" placeholder="Label" value="' + escAttr(cl.label || '') + '">' +
        '<input class="form-input cl-url" placeholder="https://..." value="' + escAttr(cl.url || '') + '">' +
        '<button class="remove-link" data-idx="' + i + '">&times;</button>' +
        '</div>';
    }).join('');
    updateAddLinkBtn();
  }

  function getCustomLinksFromForm() {
    var rows = document.querySelectorAll('#custom-links-list .custom-link-row');
    var links = [];
    rows.forEach(function(row) {
      var label = row.querySelector('.cl-label').value.trim();
      var url = row.querySelector('.cl-url').value.trim();
      if (label && url) links.push({ label: label, url: url });
    });
    return links;
  }

  function updateAddLinkBtn() {
    var rows = document.querySelectorAll('#custom-links-list .custom-link-row');
    document.getElementById('add-link-btn').style.display = rows.length >= 5 ? 'none' : 'block';
  }

  document.getElementById('custom-links-list').addEventListener('click', function(e) {
    if (e.target.classList.contains('remove-link')) {
      e.target.parentElement.remove();
      updateAddLinkBtn();
    }
  });

  document.getElementById('add-link-btn').addEventListener('click', function() {
    var links = getCustomLinksFromForm();
    if (links.length >= 5) return;
    links.push({ label: '', url: '' });
    renderCustomLinks(links);
  });

  document.getElementById('edit-cancel').addEventListener('click', function() {
    document.getElementById('edit-modal').classList.remove('active');
  });

  document.getElementById('edit-modal').addEventListener('click', function(e) {
    if (e.target === this) this.classList.remove('active');
  });

  document.getElementById('edit-save').addEventListener('click', async function() {
    var statusEl = document.getElementById('edit-status');
    this.disabled = true;
    this.textContent = 'Saving...';
    try {
      var body = {
        website: document.getElementById('edit-website').value.trim() || null,
        instagram: document.getElementById('edit-instagram').value.trim() || null,
        facebook: document.getElementById('edit-facebook').value.trim() || null,
        tiktok: document.getElementById('edit-tiktok').value.trim() || null,
        phone: document.getElementById('edit-phone').value.trim() || null,
        email: document.getElementById('edit-email').value.trim() || null,
        custom_links: getCustomLinksFromForm()
      };
      var res = await fetch(API + '/api/business/' + fhrsId, {
        method: 'PATCH',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + editToken
        },
        body: JSON.stringify(body)
      });
      if (res.status === 403) {
        localStorage.removeItem('blueroll_edit_' + fhrsId);
        editToken = null;
        document.getElementById('edit-modal').classList.remove('active');
        render();
        return;
      }
      if (!res.ok) throw new Error('Save failed');
      var updated = await res.json();
      Object.assign(bizData, updated);
      document.getElementById('edit-modal').classList.remove('active');
      render();
    } catch(e) {
      statusEl.className = 'status-msg error';
      statusEl.textContent = e.message || 'Failed to save. Please try again.';
    }
    this.disabled = false;
    this.textContent = 'Save changes';
  });

  // --- Helpers ---
  function escHtml(s) { if (!s) return ''; var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
  function escAttr(s) { return (s || '').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
})();
</script>
</body>
</html>
