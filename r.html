<!DOCTYPE html>
<html lang="en">
<head>
<script src="https://t.contentsquare.net/uxa/f84aff336d942.js" defer></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Improve Your Rating — Blueroll</title>
<meta name="robots" content="noindex, nofollow">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: -apple-system, 'SF Pro Display', system-ui, sans-serif;
  background: linear-gradient(160deg, #065F46 0%, #047857 50%, #059669 100%);
  color: white;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 24px 20px;
  min-height: 100vh;
  min-height: 100dvh;
}

.container {
  max-width: 380px; width: 100%;
  display: flex; flex-direction: column; align-items: center;
  text-align: center;
}

/* Rating */
.rating {
  display: flex; align-items: baseline; justify-content: center;
  margin-bottom: 8px;
}
.rating-num {
  font-size: 88px; font-weight: 800; line-height: 1; letter-spacing: -4px;
}
.rating-of {
  font-size: 32px; font-weight: 600; opacity: 0.25; margin-left: 4px;
}
.r-0, .r-1 { color: #FCA5A5; }
.r-2 { color: #FCD34D; }
.r-3 { color: #86EFAC; }

/* Business info */
.biz-name {
  font-size: 20px; font-weight: 700; letter-spacing: -0.4px;
  margin-bottom: 3px;
}
.biz-addr {
  font-size: 13px; opacity: 0.4; margin-bottom: 4px;
}
.rated-date {
  font-size: 11px; opacity: 0.25; margin-bottom: 20px;
}

/* Message */
.message {
  font-size: 15px; line-height: 1.5; opacity: 0.65;
  margin-bottom: 24px; max-width: 320px;
}

/* Score breakdown */
.breakdown {
  width: 100%; margin-bottom: 20px;
  background: rgba(255,255,255,0.06); border-radius: 12px;
  padding: 14px 16px;
}
.score-row {
  display: flex; align-items: center; gap: 10px;
  padding: 6px 0;
}
.score-label { font-size: 12px; opacity: 0.5; width: 80px; flex-shrink: 0; }
.score-bar {
  flex: 1; height: 6px; background: rgba(255,255,255,0.1);
  border-radius: 3px; overflow: hidden;
}
.score-fill {
  height: 100%; border-radius: 3px; transition: width 0.6s ease;
  display: block;
}
.score-fill.good { background: #34D399; }
.score-fill.ok { background: #FCD34D; }
.score-fill.bad { background: #FCA5A5; }
.score-verdict { font-size: 11px; font-weight: 600; width: 60px; text-align: right; }

/* Features — compact horizontal */
.features {
  display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
  width: 100%; margin-bottom: 24px;
}
.feat {
  background: rgba(255,255,255,0.08);
  border-radius: 10px; padding: 10px 12px;
  font-size: 12px; font-weight: 500; text-align: left;
  line-height: 1.3; opacity: 0.8;
}

/* CTA */
.cta-buttons { width: 100%; display: flex; flex-direction: column; gap: 8px; }
.cta-btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  padding: 14px; border-radius: 12px; text-decoration: none;
  font-size: 15px; font-weight: 600; transition: all 0.15s;
}
.cta-apple { background: white; color: #111; }
.cta-apple:hover { background: #f0f0f0; }
.cta-google { background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.15); }
.cta-google:hover { border-color: rgba(255,255,255,0.4); }

.trial-note {
  font-size: 11px; opacity: 0.3; margin-top: 12px;
}

.footer {
  font-size: 10px; opacity: 0.2; margin-top: 16px;
}
.footer a { color: white; }
</style>
</head>
<body>

<div class="container">
  <div class="rating">
    <span class="rating-num" id="ratingNum">—</span><span class="rating-of">/5</span>
  </div>

  <div class="biz-name" id="bizName">Your Business</div>
  <div class="biz-addr" id="bizAddr"></div>
  <div class="rated-date" id="ratedDate"></div>

  <div class="message" id="message">Digital records make getting to 5 stars easy.</div>

  <!-- Score breakdown -->
  <div class="breakdown" id="breakdown" style="display:none;">
    <div class="score-row">
      <span class="score-label">Hygiene</span>
      <span class="score-bar"><span class="score-fill" id="scoreH"></span></span>
      <span class="score-verdict" id="verdictH"></span>
    </div>
    <div class="score-row">
      <span class="score-label">Structure</span>
      <span class="score-bar"><span class="score-fill" id="scoreS"></span></span>
      <span class="score-verdict" id="verdictS"></span>
    </div>
    <div class="score-row">
      <span class="score-label">Management</span>
      <span class="score-bar"><span class="score-fill" id="scoreM"></span></span>
      <span class="score-verdict" id="verdictM"></span>
    </div>
  </div>

  <div class="features">
    <div class="feat">✓ HACCP checklists</div>
    <div class="feat">✓ AI recipe import</div>
    <div class="feat">✓ Compliance reports</div>
    <div class="feat">✓ Allergen tracking</div>
  </div>

  <div class="cta-buttons">
    <a href="#" class="cta-btn cta-apple" id="appleBtn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>
      App Store
    </a>
    <a href="#" class="cta-btn cta-google" id="googleBtn">
      <svg width="16" height="16" viewBox="0 0 24 24"><path fill="#fff" d="M3.609 1.814L13.792 12 3.61 22.186a2.37 2.37 0 01-.61-1.6V3.414c0-.6.222-1.147.609-1.6zM17.556 8.236L13.792 12l3.764 3.764 3.04-1.758c.784-.452 1.28-1.233 1.28-2.006s-.496-1.554-1.28-2.006l-3.04-1.758zM3.609 1.814L17.556 8.236 13.792 12zM3.609 22.186L13.792 12l3.764 3.764z"/></svg>
      Google Play
    </a>
  </div>

  <div class="trial-note">14 days free · then £24.99/site/mo · cancel anytime</div>
  <div class="footer"><a href="https://blueroll.app">blueroll.app</a></div>
</div>

<script>
const p = new URLSearchParams(window.location.search);
const name = p.get('name') || 'Your Business';
const addr = p.get('addr') || '';
const rating = p.get('rating') || '?';
const date = p.get('date') || '';
const r = parseInt(rating);

document.getElementById('bizName').textContent = name;
document.getElementById('bizAddr').textContent = addr;
document.getElementById('ratingNum').textContent = rating;
if (date) document.getElementById('ratedDate').textContent = 'Rated ' + date;
document.title = name + ' — Improve Your Rating';

const el = document.getElementById('ratingNum');
if (r <= 1) el.classList.add('r-1');
else if (r === 2) el.classList.add('r-2');
else if (r >= 3) el.classList.add('r-3');

const msg = {
  0: 'Urgent action needed. Digital records can help you turn this around fast.',
  1: 'Major improvements needed — digital HACCP makes it achievable.',
  2: 'You\'re close. Digital records could be the difference.',
  3: 'Good start. Go from 3 to 5 with proper compliance tools.'
};
if (msg[r]) document.getElementById('message').textContent = msg[r];

// Score breakdown (FSA: 0=best, 25=worst for hygiene/structural; 0=best, 30=worst for management)
const h = p.get('h'); const s = p.get('s'); const m = p.get('m');
if (h !== null && s !== null && m !== null) {
  document.getElementById('breakdown').style.display = 'block';

  function renderScore(id, verdictId, raw, max) {
    const val = parseInt(raw) || 0;
    const pct = Math.max(5, 100 - (val / max * 100));
    const el = document.getElementById(id);
    const vEl = document.getElementById(verdictId);
    el.style.width = pct + '%';
    if (val <= 5) { el.classList.add('good'); vEl.textContent = 'Good'; vEl.style.color = '#34D399'; }
    else if (val <= 10) { el.classList.add('ok'); vEl.textContent = 'Fair'; vEl.style.color = '#FCD34D'; }
    else { el.classList.add('bad'); vEl.textContent = 'Poor'; vEl.style.color = '#FCA5A5'; }
  }
  renderScore('scoreH', 'verdictH', h, 25);
  renderScore('scoreS', 'verdictS', s, 25);
  renderScore('scoreM', 'verdictM', m, 30);
}

// ─── Click/scan tracking ───
const src = p.get('src');
const fhrsid = p.get('fhrsid');
if (src === 'email' && fhrsid) {
  fetch('https://web-production-54cc.up.railway.app/api/contact', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ fhrs_ids: [parseInt(fhrsid)], channel: 'email_click', template: 'rating_page' })
  }).catch(() => {});
}
// Track all page views (QR scans from paper letters + any visit with fhrsid)
if (fhrsid) {
  fetch('https://web-production-54cc.up.railway.app/api/business/' + fhrsid + '/public').catch(() => {});
}

const utm = `?utm_source=${src === 'email' ? 'email_outreach' : 'fsa_letter'}&utm_medium=${src === 'email' ? 'email' : 'qr'}&utm_campaign=${encodeURIComponent(name)}`;
document.getElementById('appleBtn').href = 'https://apps.apple.com/app/blueroll/id6760937451' + utm;
document.getElementById('googleBtn').href = 'https://blueroll.app' + utm;
</script>

</body>
</html>
