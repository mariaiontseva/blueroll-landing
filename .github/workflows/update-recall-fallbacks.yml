name: Update recall fallbacks

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: write

concurrency:
  group: update-recall-fallbacks
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Refresh server-rendered recall cards
        run: node scripts/update-recall-fallbacks.mjs
      - name: Commit changed fallbacks
        run: |
          if git diff --quiet; then
            echo "No recall changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recalls/index.html recalls-us/index.html sitemap.xml
          git commit -m "chore: refresh recall fallbacks"
          git push
