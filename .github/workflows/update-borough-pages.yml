name: Update borough rating pages

on:
  workflow_dispatch:
  schedule:
    - cron: '40 5 * * 1'

permissions:
  contents: write

concurrency:
  group: update-borough-pages
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch FSA data for the 33 boroughs
        run: python3 _build/fetch_borough_data.py
      - name: Rebuild borough pages
        run: python3 _build/build_borough_pages.py
      - name: Commit refreshed pages
        run: |
          if git diff --quiet; then
            echo "No borough changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add food-hygiene-ratings _build/data sitemap.xml llms.txt
          git commit -m "chore: refresh borough rating pages"
          git push
